[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-matcher"
version = "1.0.0"
description = "Compare a resume to a job posting and see which skills you're missing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
resume-match = "resume_matcher.cli:main"

[tool.setuptools]
packages = ["resume_matcher"]
